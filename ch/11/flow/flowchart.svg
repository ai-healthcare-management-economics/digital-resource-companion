<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1313" viewBox="0 0 1200 1313">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D5560"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#FBF8F3"/>
<rect x="0" y="0" width="1200" height="14" fill="#7A1730"/>
<text x="60" y="58" font-family="DejaVu Sans, Arial" font-size="32" font-weight="700" fill="#222A33">Chapter 11: Evidence, Validation, and Real-World Evaluation</text>
<text x="60" y="90" font-family="DejaVu Sans, Arial" font-size="18" fill="#5A6470">Chapter-level decision process aligned to the fifteen-chapter reference edition.</text>
<rect x="110" y="160" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="208" r="28" fill="#7A1730"/>
<text x="158" y="217" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
<text x="205" y="197" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Formulate the evidence question</text>
<text x="205" y="232" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Link intended use, comparator, population, outcome, decision consequence, and</text>
<text x="205" y="254" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">uncertainty.</text>
<line x1="600.0" y1="273" x2="600.0" y2="295" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="303" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="351" r="28" fill="#7A1730"/>
<text x="158" y="360" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
<text x="205" y="340" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Map and appraise external evidence</text>
<text x="205" y="375" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Assess reporting quality, risk of bias, applicability, transportability, and</text>
<text x="205" y="397" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">evidence gaps.</text>
<line x1="600.0" y1="416" x2="600.0" y2="438" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="446" rx="18" ry="18" width="980" height="136" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="494" r="28" fill="#7A1730"/>
<text x="158" y="503" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
<text x="205" y="483" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Plan local validation and silent-mode</text>
<text x="205" y="511" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">evaluation</text>
<text x="205" y="546" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Define cohort, data period, metrics, subgroups, workflow, human–AI</text>
<text x="205" y="568" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">interaction, and acceptance thresholds.</text>
<line x1="600.0" y1="586" x2="600.0" y2="608" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="616" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="664" r="28" fill="#7A1730"/>
<text x="158" y="673" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
<text x="205" y="653" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Select a causal evaluation design</text>
<text x="205" y="688" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Use randomized, stepped-wedge, interrupted time series,</text>
<text x="205" y="710" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">difference-in-differences, target-trial, or other appropriate designs.</text>
<line x1="600.0" y1="729" x2="600.0" y2="751" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="759" rx="18" ry="18" width="980" height="136" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="807" r="28" fill="#7A1730"/>
<text x="158" y="816" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">5</text>
<text x="205" y="796" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Collect real-world clinical and implementation</text>
<text x="205" y="824" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">evidence</text>
<text x="205" y="859" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Measure use, fidelity, adaptations, context, outcomes, workload, equity, cost,</text>
<text x="205" y="881" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">and balancing effects.</text>
<line x1="600.0" y1="899" x2="600.0" y2="921" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="929" rx="18" ry="18" width="980" height="136" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="977" r="28" fill="#7A1730"/>
<text x="158" y="986" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">6</text>
<text x="205" y="966" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Synthesize quantitative and qualitative</text>
<text x="205" y="994" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">evidence</text>
<text x="205" y="1029" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Integrate technical, clinical, economic, implementation, governance, and</text>
<text x="205" y="1051" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">lived-experience findings.</text>
<line x1="600.0" y1="1069" x2="600.0" y2="1091" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="1099" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="1147" r="28" fill="#7A1730"/>
<text x="158" y="1156" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">7</text>
<text x="205" y="1136" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Update the decision and evidence plan</text>
<text x="205" y="1171" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Scale, modify, continue, restrict, stop, or collect additional</text>
<text x="205" y="1193" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">decision-critical evidence.</text>
<text x="1145" y="1285" text-anchor="end" font-family="DejaVu Sans, Arial" font-size="14" fill="#7A828B">AI Healthcare Economics Digital Companion • Process-flow reference</text>
</svg>