<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1259" viewBox="0 0 1200 1259">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D5560"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#FBF8F3"/>
<rect x="0" y="0" width="1200" height="14" fill="#7A1730"/>
<text x="60" y="58" font-family="DejaVu Sans, Arial" font-size="32" font-weight="700" fill="#222A33">Chapter 7: Economic Evaluation, Affordability, and Health Technology Assessment</text>
<text x="60" y="90" font-family="DejaVu Sans, Arial" font-size="18" fill="#5A6470">Chapter-level decision process aligned to the fifteen-chapter reference edition.</text>
<rect x="110" y="160" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="208" r="28" fill="#7A1730"/>
<text x="158" y="217" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
<text x="205" y="197" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Specify the economic and HTA decision</text>
<text x="205" y="232" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Define population, intervention, comparator, outcomes, perspective, horizon,</text>
<text x="205" y="254" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">and adoption authority.</text>
<line x1="600.0" y1="273" x2="600.0" y2="295" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="303" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="351" r="28" fill="#7A1730"/>
<text x="158" y="360" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
<text x="205" y="340" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Select the evaluation form</text>
<text x="205" y="375" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Choose cost-consequence, cost-effectiveness, cost-utility, budget impact,</text>
<text x="205" y="397" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">distributional, or combined analysis.</text>
<line x1="600.0" y1="416" x2="600.0" y2="438" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="446" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="494" r="28" fill="#7A1730"/>
<text x="158" y="503" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
<text x="205" y="483" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Estimate incremental costs and outcomes</text>
<text x="205" y="518" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Use the full pathway and document final, intermediate, workforce, quality, and</text>
<text x="205" y="540" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">equity effects.</text>
<line x1="600.0" y1="559" x2="600.0" y2="581" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="589" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="637" r="28" fill="#7A1730"/>
<text x="158" y="646" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
<text x="205" y="626" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Assess affordability and reimbursement</text>
<text x="205" y="661" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Model annual cash flow, funding source, eligible volume, payment, coding,</text>
<text x="205" y="683" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">tariff, and denial implications.</text>
<line x1="600.0" y1="702" x2="600.0" y2="724" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="732" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="780" r="28" fill="#7A1730"/>
<text x="158" y="789" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">5</text>
<text x="205" y="769" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Characterize uncertainty and distribution</text>
<text x="205" y="804" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Use sensitivity, scenarios, subgroups, thresholds, and value-of-information</text>
<text x="205" y="826" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">logic.</text>
<line x1="600.0" y1="845" x2="600.0" y2="867" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="875" rx="18" ry="18" width="980" height="136" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="923" r="28" fill="#7A1730"/>
<text x="158" y="932" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">6</text>
<text x="205" y="912" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Integrate HTA, procurement, and local</text>
<text x="205" y="940" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">readiness</text>
<text x="205" y="975" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Distinguish regulatory authorization, assessment, reimbursement, procurement,</text>
<text x="205" y="997" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">and local adoption.</text>
<line x1="600.0" y1="1015" x2="600.0" y2="1037" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="1045" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="1093" r="28" fill="#7A1730"/>
<text x="158" y="1102" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">7</text>
<text x="205" y="1082" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Issue a conditional recommendation</text>
<text x="205" y="1117" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Adopt, pilot, restrict, defer, redesign, reject, or retire with explicit</text>
<text x="205" y="1139" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">conditions.</text>
<text x="1145" y="1231" text-anchor="end" font-family="DejaVu Sans, Arial" font-size="14" fill="#7A828B">AI Healthcare Economics Digital Companion • Process-flow reference</text>
</svg>