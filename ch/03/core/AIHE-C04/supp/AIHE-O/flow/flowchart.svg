<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="951" viewBox="0 0 1200 951">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D5560"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#FBF8F3"/>
<rect x="0" y="0" width="1200" height="14" fill="#7A1730"/>
<text x="60" y="58" font-family="DejaVu Sans, Arial" font-size="32" font-weight="700" fill="#222A33">AIHE-O: HOAM Accountability Workbook</text>
<text x="60" y="90" font-family="DejaVu Sans, Arial" font-size="18" fill="#5A6470">Primary lifecycle stage: Assess governance and institutional risk. Primary book chapter: 3.</text>
<rect x="110" y="160" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="208" r="28" fill="#7A1730"/>
<text x="158" y="217" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
<text x="205" y="197" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Define the institutional-risk context</text>
<text x="205" y="232" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Identify rights, affected groups, consequence, and mandatory obligations</text>
<text x="205" y="254" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">relevant to HOAM Accountability Workbook.</text>
<line x1="600.0" y1="273" x2="600.0" y2="295" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="303" rx="18" ry="18" width="980" height="114" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="351" r="28" fill="#7A1730"/>
<text x="158" y="360" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
<text x="205" y="340" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Assess accountability, ethics, equity,</text>
<text x="205" y="368" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">privacy, and security</text>
<text x="205" y="403" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Document evidence, threats, burdens, controls, and residual uncertainty.</text>
<line x1="600.0" y1="421" x2="600.0" y2="443" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="451" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="499" r="28" fill="#7A1730"/>
<text x="158" y="508" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
<text x="205" y="488" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Design safeguards and human oversight</text>
<text x="205" y="523" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Specify decision rights, access, review, escalation, fallback, communication,</text>
<text x="205" y="545" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">and monitoring.</text>
<line x1="600.0" y1="564" x2="600.0" y2="586" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="594" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="642" r="28" fill="#7A1730"/>
<text x="158" y="651" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
<text x="205" y="631" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Conduct multidisciplinary assurance</text>
<text x="205" y="666" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Review legal, ethical, clinical, quality, data, cybersecurity, economic, and</text>
<text x="205" y="688" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">public-value findings.</text>
<line x1="600.0" y1="707" x2="600.0" y2="729" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="737" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="785" r="28" fill="#7A1730"/>
<text x="158" y="794" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">5</text>
<text x="205" y="774" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Decide and monitor</text>
<text x="205" y="809" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Approve, condition, restrict, defer, redesign, or reject; assign review</text>
<text x="205" y="831" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">triggers and owners.</text>
<text x="1145" y="923" text-anchor="end" font-family="DejaVu Sans, Arial" font-size="14" fill="#7A828B">AI Healthcare Economics Digital Companion • Process-flow reference</text>
</svg>