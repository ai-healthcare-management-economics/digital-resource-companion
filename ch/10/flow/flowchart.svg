<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1254" viewBox="0 0 1200 1254">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D5560"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#FBF8F3"/>
<rect x="0" y="0" width="1200" height="14" fill="#7A1730"/>
<text x="60" y="58" font-family="DejaVu Sans, Arial" font-size="32" font-weight="700" fill="#222A33">Chapter 10: Governance, Accountability, and Institutional Risk</text>
<text x="60" y="90" font-family="DejaVu Sans, Arial" font-size="18" fill="#5A6470">Chapter-level decision process aligned to the fifteen-chapter reference edition.</text>
<rect x="110" y="160" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="208" r="28" fill="#7A1730"/>
<text x="158" y="217" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
<text x="205" y="197" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Define the institutional risk context</text>
<text x="205" y="232" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Identify intended use, consequence, affected rights, stakeholders, and</text>
<text x="205" y="254" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">mandatory obligations.</text>
<line x1="600.0" y1="273" x2="600.0" y2="295" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="303" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="351" r="28" fill="#7A1730"/>
<text x="158" y="360" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
<text x="205" y="340" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Assign accountability and decision rights</text>
<text x="205" y="375" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Name accountable owners, responsible teams, consultation duties, and pause,</text>
<text x="205" y="397" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">update, restart, and retirement authority.</text>
<line x1="600.0" y1="416" x2="600.0" y2="438" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="446" rx="18" ry="18" width="980" height="136" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="494" r="28" fill="#7A1730"/>
<text x="158" y="503" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
<text x="205" y="483" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Assess ethics, equity, privacy, and</text>
<text x="205" y="511" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">cybersecurity</text>
<text x="205" y="546" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Examine autonomy, fairness, lawful use, data protection, threats, resilience,</text>
<text x="205" y="568" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">and burden distribution.</text>
<line x1="600.0" y1="586" x2="600.0" y2="608" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="616" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="664" r="28" fill="#7A1730"/>
<text x="158" y="673" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
<text x="205" y="653" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Assess transparency, trust, and contestability</text>
<text x="205" y="688" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Define explanations, communication, human alternatives, challenge routes, and</text>
<text x="205" y="710" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">incident transparency.</text>
<line x1="600.0" y1="729" x2="600.0" y2="751" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="759" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="807" r="28" fill="#7A1730"/>
<text x="158" y="816" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">5</text>
<text x="205" y="796" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Design mandatory safeguards</text>
<text x="205" y="831" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Specify human oversight, access controls, monitoring, fallback, escalation,</text>
<text x="205" y="853" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">and independent assurance.</text>
<line x1="600.0" y1="872" x2="600.0" y2="894" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="902" rx="18" ry="18" width="980" height="104" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="950" r="28" fill="#7A1730"/>
<text x="158" y="959" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">6</text>
<text x="205" y="939" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Make and document the governance decision</text>
<text x="205" y="974" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Approve, approve with conditions, restrict, defer, redesign, or reject.</text>
<line x1="600.0" y1="1010" x2="600.0" y2="1032" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="1040" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="1088" r="28" fill="#7A1730"/>
<text x="158" y="1097" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">7</text>
<text x="205" y="1077" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Review performance and residual risk</text>
<text x="205" y="1112" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Monitor incidents, complaints, subgroup effects, regulatory change, and trust</text>
<text x="205" y="1134" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">signals.</text>
<text x="1145" y="1226" text-anchor="end" font-family="DejaVu Sans, Arial" font-size="14" fill="#7A828B">AI Healthcare Economics Digital Companion • Process-flow reference</text>
</svg>