<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1222" viewBox="0 0 1200 1222">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D5560"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#FBF8F3"/>
<rect x="0" y="0" width="1200" height="14" fill="#7A1730"/>
<text x="60" y="58" font-family="DejaVu Sans, Arial" font-size="32" font-weight="700" fill="#222A33">Chapter 13: Circular Health Systems and Resource Stewardship</text>
<text x="60" y="90" font-family="DejaVu Sans, Arial" font-size="18" fill="#5A6470">Chapter-level decision process aligned to the fifteen-chapter reference edition.</text>
<rect x="110" y="160" rx="18" ry="18" width="980" height="104" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="208" r="28" fill="#7A1730"/>
<text x="158" y="217" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
<text x="205" y="197" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Define the service need and functional output</text>
<text x="205" y="232" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Start with the health-system function rather than the asset or technology.</text>
<line x1="600.0" y1="268" x2="600.0" y2="290" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="298" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="346" r="28" fill="#7A1730"/>
<text x="158" y="355" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
<text x="205" y="335" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Prevent or avoid unnecessary demand</text>
<text x="205" y="370" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Eliminate duplicate, low-value, over-specified, or avoidable acquisition,</text>
<text x="205" y="392" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">storage, computation, and activity.</text>
<line x1="600.0" y1="411" x2="600.0" y2="433" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="441" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="489" r="28" fill="#7A1730"/>
<text x="158" y="498" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
<text x="205" y="478" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Reduce and optimize resource intensity</text>
<text x="205" y="513" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Improve utilization, model efficiency, storage, energy, water, material use,</text>
<text x="205" y="535" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">and maintenance.</text>
<line x1="600.0" y1="554" x2="600.0" y2="576" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="584" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="632" r="28" fill="#7A1730"/>
<text x="158" y="641" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
<text x="205" y="621" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Share and intensify safe use</text>
<text x="205" y="656" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Evaluate shared infrastructure, service models, capacity, access, resilience,</text>
<text x="205" y="678" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">and dependency.</text>
<line x1="600.0" y1="697" x2="600.0" y2="719" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="727" rx="18" ry="18" width="980" height="104" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="775" r="28" fill="#7A1730"/>
<text x="158" y="784" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">5</text>
<text x="205" y="764" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Maintain, repair, reuse, and refurbish</text>
<text x="205" y="799" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Preserve safe useful life before replacement, recovery, or disposal.</text>
<line x1="600.0" y1="835" x2="600.0" y2="857" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="865" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="913" r="28" fill="#7A1730"/>
<text x="158" y="922" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">6</text>
<text x="205" y="902" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Recover materials and dispose responsibly</text>
<text x="205" y="937" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Use verified take-back, chain of custody, recovery, secure erasure, and lawful</text>
<text x="205" y="959" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">final disposition.</text>
<line x1="600.0" y1="978" x2="600.0" y2="1000" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="1008" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="1056" r="28" fill="#7A1730"/>
<text x="158" y="1065" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">7</text>
<text x="205" y="1045" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Monitor rebound, burden shifting, and equity</text>
<text x="205" y="1080" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Check whether lower unit burden increases total use or transfers burdens</text>
<text x="205" y="1102" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">across populations or regions.</text>
<text x="1145" y="1194" text-anchor="end" font-family="DejaVu Sans, Arial" font-size="14" fill="#7A828B">AI Healthcare Economics Digital Companion • Process-flow reference</text>
</svg>