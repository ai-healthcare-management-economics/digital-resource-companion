<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="973" viewBox="0 0 1200 973">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D5560"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#FBF8F3"/>
<rect x="0" y="0" width="1200" height="14" fill="#7A1730"/>
<text x="60" y="58" font-family="DejaVu Sans, Arial" font-size="32" font-weight="700" fill="#222A33">AIHE-E02: Circular Procurement and Supplier Scorecard</text>
<text x="60" y="90" font-family="DejaVu Sans, Arial" font-size="18" fill="#5A6470">Core consolidated process aligned to Chapter 14 and Resource Set E.</text>
<rect x="110" y="160" rx="18" ry="18" width="980" height="136" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="208" r="28" fill="#7A1730"/>
<text x="158" y="217" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
<text x="205" y="197" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Define the service output and lifecycle</text>
<text x="205" y="225" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">boundary</text>
<text x="205" y="260" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Clarify the functional unit, service requirement, assets, resources, and</text>
<text x="205" y="282" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">constraints relevant to Circular Procurement and Supplier Scorecard.</text>
<line x1="600.0" y1="300" x2="600.0" y2="322" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="330" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="378" r="28" fill="#7A1730"/>
<text x="158" y="387" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
<text x="205" y="367" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Apply the circularity hierarchy</text>
<text x="205" y="402" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Evaluate avoidance, reduction, sharing, maintenance, repair, reuse,</text>
<text x="205" y="424" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">refurbishment, recovery, and disposal.</text>
<line x1="600.0" y1="443" x2="600.0" y2="465" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="473" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="521" r="28" fill="#7A1730"/>
<text x="158" y="530" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
<text x="205" y="510" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Measure economic and environmental effects</text>
<text x="205" y="545" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Document lifecycle cost, energy, water, carbon, materials, residual value,</text>
<text x="205" y="567" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">resilience, equity, and rebound.</text>
<line x1="600.0" y1="586" x2="600.0" y2="608" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="616" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="664" r="28" fill="#7A1730"/>
<text x="158" y="673" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
<text x="205" y="653" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Compare options under uncertainty</text>
<text x="205" y="688" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Use common boundaries, safety requirements, sensitivity, and non-compensatory</text>
<text x="205" y="710" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">safeguards.</text>
<line x1="600.0" y1="729" x2="600.0" y2="751" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="759" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="807" r="28" fill="#7A1730"/>
<text x="158" y="816" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">5</text>
<text x="205" y="796" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Decide, contract, and monitor</text>
<text x="205" y="831" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Set procurement, asset-life, take-back, disposition, annual review, and</text>
<text x="205" y="853" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">corrective-action requirements.</text>
<text x="1145" y="945" text-anchor="end" font-family="DejaVu Sans, Arial" font-size="14" fill="#7A828B">AI Healthcare Economics Digital Companion • Process-flow reference</text>
</svg>