<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1335" viewBox="0 0 1200 1335">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D5560"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#FBF8F3"/>
<rect x="0" y="0" width="1200" height="14" fill="#7A1730"/>
<text x="60" y="58" font-family="DejaVu Sans, Arial" font-size="32" font-weight="700" fill="#222A33">Chapter 14: Circular Procurement and Asset Stewardship</text>
<text x="60" y="90" font-family="DejaVu Sans, Arial" font-size="18" fill="#5A6470">Chapter-level decision process aligned to the fifteen-chapter reference edition.</text>
<rect x="110" y="160" rx="18" ry="18" width="980" height="136" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="208" r="28" fill="#7A1730"/>
<text x="158" y="217" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
<text x="205" y="197" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Translate service needs into lifecycle</text>
<text x="205" y="225" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">procurement criteria</text>
<text x="205" y="260" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Specify durability, modularity, repairability, interoperability, support,</text>
<text x="205" y="282" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">take-back, and data requirements.</text>
<line x1="600.0" y1="300" x2="600.0" y2="322" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="330" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="378" r="28" fill="#7A1730"/>
<text x="158" y="387" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
<text x="205" y="367" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Assess the current asset and dependencies</text>
<text x="205" y="402" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Review condition, remaining life, software support, cybersecurity, validation,</text>
<text x="205" y="424" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">workload, downtime, and supply chain.</text>
<line x1="600.0" y1="443" x2="600.0" y2="465" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="473" rx="18" ry="18" width="980" height="136" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="521" r="28" fill="#7A1730"/>
<text x="158" y="530" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
<text x="205" y="510" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Compare maintain, repair, refurbish, replace,</text>
<text x="205" y="538" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">and share options</text>
<text x="205" y="573" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Use the same service requirement, horizon, safety constraints, and cost</text>
<text x="205" y="595" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">boundary.</text>
<line x1="600.0" y1="613" x2="600.0" y2="635" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="643" rx="18" ry="18" width="980" height="136" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="691" r="28" fill="#7A1730"/>
<text x="158" y="700" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
<text x="205" y="680" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Validate safety, regulatory, quality, and</text>
<text x="205" y="708" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">continuity conditions</text>
<text x="205" y="743" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Confirm infection prevention, device requirements, data erasure, recipient due</text>
<text x="205" y="765" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">diligence, and fallback.</text>
<line x1="600.0" y1="783" x2="600.0" y2="805" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="813" rx="18" ry="18" width="980" height="136" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="861" r="28" fill="#7A1730"/>
<text x="158" y="870" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">5</text>
<text x="205" y="850" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Contract for support, residual value, and end</text>
<text x="205" y="878" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">of life</text>
<text x="205" y="913" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Define components, updates, take-back, recovery evidence, pricing, remedies,</text>
<text x="205" y="935" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">and exit.</text>
<line x1="600.0" y1="953" x2="600.0" y2="975" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="983" rx="18" ry="18" width="980" height="104" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="1031" r="28" fill="#7A1730"/>
<text x="158" y="1040" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">6</text>
<text x="205" y="1020" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Implement the selected option</text>
<text x="205" y="1055" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Plan transition, training, downtime, testing, communication, and monitoring.</text>
<line x1="600.0" y1="1091" x2="600.0" y2="1113" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="1121" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="1169" r="28" fill="#7A1730"/>
<text x="158" y="1178" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">7</text>
<text x="205" y="1158" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Decommission and close responsibly</text>
<text x="205" y="1193" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Preserve records, erase data, maintain chain of custody, verify disposition,</text>
<text x="205" y="1215" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">and recognize residual or recovery value.</text>
<text x="1145" y="1307" text-anchor="end" font-family="DejaVu Sans, Arial" font-size="14" fill="#7A828B">AI Healthcare Economics Digital Companion • Process-flow reference</text>
</svg>