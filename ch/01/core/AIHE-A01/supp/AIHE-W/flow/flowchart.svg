<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="931" viewBox="0 0 1200 931">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D5560"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#FBF8F3"/>
<rect x="0" y="0" width="1200" height="14" fill="#7A1730"/>
<text x="60" y="58" font-family="DejaVu Sans, Arial" font-size="32" font-weight="700" fill="#222A33">AIHE-W: AI Use-Case Canvas</text>
<text x="60" y="90" font-family="DejaVu Sans, Arial" font-size="18" fill="#5A6470">Primary lifecycle stage: Define the decision. Primary book chapter: 1.</text>
<rect x="110" y="160" rx="18" ry="18" width="980" height="104" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="208" r="28" fill="#7A1730"/>
<text x="158" y="217" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
<text x="205" y="197" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Confirm the initiating problem</text>
<text x="205" y="232" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Clarify why AI Use-Case Canvas is needed and what decision it supports.</text>
<line x1="600.0" y1="268" x2="600.0" y2="290" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="298" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="346" r="28" fill="#7A1730"/>
<text x="158" y="355" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
<text x="205" y="335" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Identify stakeholders and authority</text>
<text x="205" y="370" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Name accountable owners, affected groups, specialists, and participation</text>
<text x="205" y="392" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">requirements.</text>
<line x1="600.0" y1="411" x2="600.0" y2="433" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="441" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="489" r="28" fill="#7A1730"/>
<text x="158" y="498" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
<text x="205" y="478" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Define scope and comparator</text>
<text x="205" y="513" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Specify population, setting, intervention bundle, alternatives, outcomes, and</text>
<text x="205" y="535" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">exclusions.</text>
<line x1="600.0" y1="554" x2="600.0" y2="576" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="584" rx="18" ry="18" width="980" height="104" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="632" r="28" fill="#7A1730"/>
<text x="158" y="641" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
<text x="205" y="621" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Complete and review the record</text>
<text x="205" y="656" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Document evidence, assumptions, unresolved questions, and required approvals.</text>
<line x1="600.0" y1="692" x2="600.0" y2="714" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="722" rx="18" ry="18" width="980" height="104" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="770" r="28" fill="#7A1730"/>
<text x="158" y="779" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">5</text>
<text x="205" y="759" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Authorize the next stage</text>
<text x="205" y="794" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Approve, revise, defer, or stop; archive the versioned record and review date.</text>
<text x="1145" y="903" text-anchor="end" font-family="DejaVu Sans, Arial" font-size="14" fill="#7A828B">AI Healthcare Economics Digital Companion • Process-flow reference</text>
</svg>