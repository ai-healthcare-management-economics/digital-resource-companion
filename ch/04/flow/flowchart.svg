<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1232" viewBox="0 0 1200 1232">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D5560"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#FBF8F3"/>
<rect x="0" y="0" width="1200" height="14" fill="#7A1730"/>
<text x="60" y="58" font-family="DejaVu Sans, Arial" font-size="32" font-weight="700" fill="#222A33">Chapter 4: Productivity, Work Redesign, and Implementation</text>
<text x="60" y="90" font-family="DejaVu Sans, Arial" font-size="18" fill="#5A6470">Chapter-level decision process aligned to the fifteen-chapter reference edition.</text>
<rect x="110" y="160" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="208" r="28" fill="#7A1730"/>
<text x="158" y="217" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
<text x="205" y="197" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Decompose tasks and establish the baseline</text>
<text x="205" y="232" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Measure current work, handoffs, delay, rework, quality, burden, and role</text>
<text x="205" y="254" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">boundaries.</text>
<line x1="600.0" y1="273" x2="600.0" y2="295" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="303" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="351" r="28" fill="#7A1730"/>
<text x="158" y="360" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
<text x="205" y="340" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Identify AI–human allocation options</text>
<text x="205" y="375" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Separate tasks suitable for automation, augmentation, review, escalation, and</text>
<text x="205" y="397" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">human-only performance.</text>
<line x1="600.0" y1="416" x2="600.0" y2="438" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="446" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="494" r="28" fill="#7A1730"/>
<text x="158" y="503" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
<text x="205" y="483" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Redesign workflow and roles</text>
<text x="205" y="518" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Define new responsibilities, supervision, competencies, fallback, and</text>
<text x="205" y="540" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">downstream capacity.</text>
<line x1="600.0" y1="559" x2="600.0" y2="581" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="589" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="637" r="28" fill="#7A1730"/>
<text x="158" y="646" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
<text x="205" y="626" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Implement a controlled pilot</text>
<text x="205" y="661" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Train users, monitor adoption, collect workflow evidence, and preserve</text>
<text x="205" y="683" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">reversibility.</text>
<line x1="600.0" y1="702" x2="600.0" y2="724" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="732" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="780" r="28" fill="#7A1730"/>
<text x="158" y="789" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">5</text>
<text x="205" y="769" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Measure gross and net productivity</text>
<text x="205" y="804" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Subtract review, correction, coordination, downtime, and displaced work from</text>
<text x="205" y="826" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">gross time saved.</text>
<line x1="600.0" y1="845" x2="600.0" y2="867" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="875" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="923" r="28" fill="#7A1730"/>
<text x="158" y="932" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">6</text>
<text x="205" y="912" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Convert released capacity into realized value</text>
<text x="205" y="947" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Document redeployment, improved quality, reduced delay, avoided harm, or other</text>
<text x="205" y="969" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">verified outcomes.</text>
<line x1="600.0" y1="988" x2="600.0" y2="1010" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="1018" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="1066" r="28" fill="#7A1730"/>
<text x="158" y="1075" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">7</text>
<text x="205" y="1055" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Adapt and sustain</text>
<text x="205" y="1090" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Address implementation determinants, professional effects, maintenance, and</text>
<text x="205" y="1112" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">scale conditions.</text>
<text x="1145" y="1204" text-anchor="end" font-family="DejaVu Sans, Arial" font-size="14" fill="#7A828B">AI Healthcare Economics Digital Companion • Process-flow reference</text>
</svg>