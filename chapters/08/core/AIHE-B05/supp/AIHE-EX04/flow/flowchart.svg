<rect width="100%" height="100%" fill="#FBF8F3"/>
<rect x="0" y="0" width="1200" height="14" fill="#7A1730"/>
<text x="60" y="58" font-family="DejaVu Sans, Arial" font-size="32" font-weight="700" fill="#222A33">AIHE-EX04: Evidence and Assumption Log</text>
<text x="60" y="90" font-family="DejaVu Sans, Arial" font-size="18" fill="#5A6470">Primary lifecycle stage: Establish evidence and quality requirements. Primary book chapter: 11.</text>
<rect x="110" y="160" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="208" r="28" fill="#7A1730"/>
<text x="158" y="217" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
<text x="205" y="197" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Define the evidence or quality question</text>
<text x="205" y="232" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Clarify the claim, intended use, consequence, and decision supported by</text>
<text x="205" y="254" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Evidence and Assumption Log.</text>
<line x1="600.0" y1="273" x2="600.0" y2="295" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="303" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="351" r="28" fill="#7A1730"/>
<text x="158" y="360" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
<text x="205" y="340" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Identify standards and evidence sources</text>
<text x="205" y="375" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Select applicable reporting, appraisal, quality, accreditation, and assurance</text>
<text x="205" y="397" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">requirements.</text>
<line x1="600.0" y1="416" x2="600.0" y2="438" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="446" rx="18" ry="18" width="980" height="104" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="494" r="28" fill="#7A1730"/>
<text x="158" y="503" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
<text x="205" y="483" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Appraise relevance and quality</text>
<text x="205" y="518" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Assess bias, applicability, transportability, completeness, and uncertainty.</text>
<line x1="600.0" y1="554" x2="600.0" y2="576" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="584" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="632" r="28" fill="#7A1730"/>
<text x="158" y="641" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
<text x="205" y="621" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Plan local validation and thresholds</text>
<text x="205" y="656" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Define data, metrics, subgroups, workflow, acceptance criteria, and balancing</text>
<text x="205" y="678" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">indicators.</text>
<line x1="600.0" y1="697" x2="600.0" y2="719" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="727" rx="18" ry="18" width="980" height="104" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="775" r="28" fill="#7A1730"/>
<text x="158" y="784" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">5</text>
<text x="205" y="764" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Approve the evidence plan</text>
<text x="205" y="799" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Document gaps, owners, review dates, and conditions for proceeding.</text>
<text x="1145" y="908" text-anchor="end" font-family="DejaVu Sans, Arial" font-size="14" fill="#7A828B">AI Healthcare Economics Digital Companion • Process-flow reference</text>
