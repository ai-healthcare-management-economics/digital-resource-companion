<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1286" viewBox="0 0 1200 1286">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D5560"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#FBF8F3"/>
<rect x="0" y="0" width="1200" height="14" fill="#7A1730"/>
<text x="60" y="58" font-family="DejaVu Sans, Arial" font-size="32" font-weight="700" fill="#222A33">Chapter 8: Decision Modelling, Simulation, and the Value of Information</text>
<text x="60" y="90" font-family="DejaVu Sans, Arial" font-size="18" fill="#5A6470">Chapter-level decision process aligned to the fifteen-chapter reference edition.</text>
<rect x="110" y="160" rx="18" ry="18" width="980" height="136" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="208" r="28" fill="#7A1730"/>
<text x="158" y="217" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
<text x="205" y="197" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Translate the decision into a model</text>
<text x="205" y="225" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">specification</text>
<text x="205" y="260" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Define the causal structure, states or events, time horizon, perspective,</text>
<text x="205" y="282" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">outputs, and decision rule.</text>
<line x1="600.0" y1="300" x2="600.0" y2="322" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="330" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="378" r="28" fill="#7A1730"/>
<text x="158" y="387" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
<text x="205" y="367" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Select the analytic or simulation method</text>
<text x="205" y="402" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Match decision tree, Markov, microsimulation, discrete-event, system-dynamics,</text>
<text x="205" y="424" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">agent-based, or hybrid methods to the problem.</text>
<line x1="600.0" y1="443" x2="600.0" y2="465" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="473" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="521" r="28" fill="#7A1730"/>
<text x="158" y="530" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
<text x="205" y="510" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Assemble data, parameters, and evidence</text>
<text x="205" y="545" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Document sources, distributions, correlations, assumptions, heterogeneity, and</text>
<text x="205" y="567" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">versions.</text>
<line x1="600.0" y1="586" x2="600.0" y2="608" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="616" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="664" r="28" fill="#7A1730"/>
<text x="158" y="673" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
<text x="205" y="653" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Implement and verify</text>
<text x="205" y="688" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Test logic, calculations, traces, extreme values, convergence, and code or</text>
<text x="205" y="710" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">spreadsheet integrity.</text>
<line x1="600.0" y1="729" x2="600.0" y2="751" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="759" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="807" r="28" fill="#7A1730"/>
<text x="158" y="816" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">5</text>
<text x="205" y="796" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Validate for the intended use</text>
<text x="205" y="831" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Assess face, internal, external, predictive, and decision validity</text>
<text x="205" y="853" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">proportionately.</text>
<line x1="600.0" y1="872" x2="600.0" y2="894" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="902" rx="18" ry="18" width="980" height="136" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="950" r="28" fill="#7A1730"/>
<text x="158" y="959" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">6</text>
<text x="205" y="939" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Characterize uncertainty and value of</text>
<text x="205" y="967" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">information</text>
<text x="205" y="1002" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Test parameter, structural, methodological, and scn uncertainty and</text>
<text x="205" y="1024" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">identify valuable additional evidence.</text>
<line x1="600.0" y1="1042" x2="600.0" y2="1064" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="1072" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="1120" r="28" fill="#7A1730"/>
<text x="158" y="1129" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">7</text>
<text x="205" y="1109" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Communicate and archive</text>
<text x="205" y="1144" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Present disaggregated results, decision uncertainty, limitations,</text>
<text x="205" y="1166" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">reproducibility, and versioned records.</text>
<text x="1145" y="1258" text-anchor="end" font-family="DejaVu Sans, Arial" font-size="14" fill="#7A828B">AI Healthcare Economics Digital Companion • Process-flow reference</text>
</svg>