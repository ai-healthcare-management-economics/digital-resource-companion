<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1089" viewBox="0 0 1200 1089">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D5560"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#FBF8F3"/>
<rect x="0" y="0" width="1200" height="14" fill="#7A1730"/>
<text x="60" y="58" font-family="DejaVu Sans, Arial" font-size="32" font-weight="700" fill="#222A33">Chapter 1: AI as a Health-System Intervention</text>
<text x="60" y="90" font-family="DejaVu Sans, Arial" font-size="18" fill="#5A6470">Chapter-level decision process aligned to the fifteen-chapter reference edition.</text>
<rect x="110" y="160" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="208" r="28" fill="#7A1730"/>
<text x="158" y="217" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
<text x="205" y="197" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Define the institutional problem</text>
<text x="205" y="232" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">State the baseline burden, affected population, decision-maker, and decision</text>
<text x="205" y="254" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">window.</text>
<line x1="600.0" y1="273" x2="600.0" y2="295" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="303" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="351" r="28" fill="#7A1730"/>
<text x="158" y="360" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
<text x="205" y="340" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Map the complete intervention bundle</text>
<text x="205" y="375" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Include data, model, interfaces, users, review, workflow, downstream action,</text>
<text x="205" y="397" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">monitoring, support, and exit.</text>
<line x1="600.0" y1="416" x2="600.0" y2="438" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="446" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="494" r="28" fill="#7A1730"/>
<text x="158" y="503" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
<text x="205" y="483" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Identify realistic comparators</text>
<text x="205" y="518" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Compare AI with current practice, process redesign, staffing, conventional</text>
<text x="205" y="540" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">digital tools, other AI, and no-change options.</text>
<line x1="600.0" y1="559" x2="600.0" y2="581" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="589" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="637" r="28" fill="#7A1730"/>
<text x="158" y="646" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
<text x="205" y="626" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Formulate the causal value hypothesis</text>
<text x="205" y="661" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Explain how the intervention changes decisions, actions, outcomes, resources,</text>
<text x="205" y="683" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">equity, and public value.</text>
<line x1="600.0" y1="702" x2="600.0" y2="724" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="732" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="780" r="28" fill="#7A1730"/>
<text x="158" y="789" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">5</text>
<text x="205" y="769" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Specify evidence and safeguards</text>
<text x="205" y="804" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Define the evidence required, mandatory safeguards, uncertainty, and</text>
<text x="205" y="826" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">conditions for responsible use.</text>
<line x1="600.0" y1="845" x2="600.0" y2="867" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="875" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="923" r="28" fill="#7A1730"/>
<text x="158" y="932" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">6</text>
<text x="205" y="912" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Set a reversible decision rule</text>
<text x="205" y="947" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Define proceed, redesign, validate silently, pilot, scale, restrict, pause,</text>
<text x="205" y="969" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">replace, or retire criteria.</text>
<text x="1145" y="1061" text-anchor="end" font-family="DejaVu Sans, Arial" font-size="14" fill="#7A828B">AI Healthcare Economics Digital Companion • Process-flow reference</text>
</svg>