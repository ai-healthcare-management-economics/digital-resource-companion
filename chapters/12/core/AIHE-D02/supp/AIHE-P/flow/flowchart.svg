<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="946" viewBox="0 0 1200 946">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D5560"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#FBF8F3"/>
<rect x="0" y="0" width="1200" height="14" fill="#7A1730"/>
<text x="60" y="58" font-family="DejaVu Sans, Arial" font-size="32" font-weight="700" fill="#222A33">AIHE-P: AI-HED Dossier Template</text>
<text x="60" y="90" font-family="DejaVu Sans, Arial" font-size="18" fill="#5A6470">Primary lifecycle stage: Assemble the decision record and renew or retire. Primary book chapter: 12.</text>
<rect x="110" y="160" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="208" r="28" fill="#7A1730"/>
<text x="158" y="217" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
<text x="205" y="197" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Assemble the current decision dossier</text>
<text x="205" y="232" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Bring together the problem, evidence, economics, governance, implementation,</text>
<text x="205" y="254" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">monitoring, and changes relevant to AI-HED Dossier Template.</text>
<line x1="600.0" y1="273" x2="600.0" y2="295" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="303" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="351" r="28" fill="#7A1730"/>
<text x="158" y="360" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
<text x="205" y="340" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Check completeness and mandatory safeguards</text>
<text x="205" y="375" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Resolve inconsistencies, evidence gaps, unowned risks, expired reviews, and</text>
<text x="205" y="397" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">non-compensatory failures.</text>
<line x1="600.0" y1="416" x2="600.0" y2="438" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="446" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="494" r="28" fill="#7A1730"/>
<text x="158" y="503" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
<text x="205" y="483" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Conduct accountable deliberation</text>
<text x="205" y="518" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Compare options, dissent, uncertainty, opportunity cost, continuity, and</text>
<text x="205" y="540" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">public-value implications.</text>
<line x1="600.0" y1="559" x2="600.0" y2="581" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="589" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="637" r="28" fill="#7A1730"/>
<text x="158" y="646" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
<text x="205" y="626" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Issue the decision and conditions</text>
<text x="205" y="661" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Approve, pilot, scale, restrict, pause, replace, or retire with owners and</text>
<text x="205" y="683" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">thresholds.</text>
<line x1="600.0" y1="702" x2="600.0" y2="724" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="732" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="780" r="28" fill="#7A1730"/>
<text x="158" y="789" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">5</text>
<text x="205" y="769" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Maintain review and archival traceability</text>
<text x="205" y="804" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Record version, evidence cut-off, next review, trigger events, change log, and</text>
<text x="205" y="826" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">final disposition.</text>
<text x="1145" y="918" text-anchor="end" font-family="DejaVu Sans, Arial" font-size="14" fill="#7A828B">AI Healthcare Economics Digital Companion • Process-flow reference</text>
</svg>