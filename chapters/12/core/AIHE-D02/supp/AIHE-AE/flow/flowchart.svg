<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="953" viewBox="0 0 1200 953">
<rect width="1200" height="953" fill="#F5F0E7"/>
<rect width="1200" height="110" fill="#6B2230"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#877567"/></marker></defs>
<text x="60" y="43" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">AIHE-AE — AI-HED Completeness and Decision-Quality Review</text>
<rect x="75" y="148" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="181" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">1. Assemble the current decision dossier</text>
<text x="101" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Bring together the problem, evidence, economics, governance, implementation, monitoring, and</text>
<text x="101" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">changes relevant to AI-HED Completeness and Decision-Quality Review.</text>
<path d="M600,266 V295" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="303" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="336" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">2. Check completeness and mandatory safeguards</text>
<text x="101" y="371" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Resolve inconsistencies, evidence gaps, unowned risks, expired reviews, and non-compensatory</text>
<text x="101" y="396" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">failures.</text>
<path d="M600,421 V450" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="458" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="491" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">3. Conduct accountable deliberation</text>
<text x="101" y="526" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Compare options, dissent, uncertainty, opportunity cost, continuity, and public-value</text>
<text x="101" y="551" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">implications.</text>
<path d="M600,576 V605" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="613" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="646" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">4. Issue the decision and conditions</text>
<text x="101" y="681" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Approve, pilot, scale, restrict, pause, replace, or retire with owners and thresholds.</text>
<path d="M600,706 V735" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="743" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="776" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">5. Maintain review and archival traceability</text>
<text x="101" y="811" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Record version, evidence cut-off, next review, trigger events, change log, and final</text>
<text x="101" y="836" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">disposition.</text>
<text x="60" y="911" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#877567">Iterative decision support: return to earlier evidence or assessment when a review trigger requires it.</text>
</svg>