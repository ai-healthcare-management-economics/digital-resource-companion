<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="878" viewBox="0 0 1200 878">
<rect width="1200" height="878" fill="#F5F0E7"/>
<rect width="1200" height="110" fill="#6B2230"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#877567"/></marker></defs>
<text x="60" y="43" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">AIHE-A04 — Data Source, Provenance, and Fitness Record</text>
<rect x="75" y="148" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="181" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">1. Confirm the initiating problem</text>
<text x="101" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Clarify why Data Source, Provenance, and Fitness Record is needed and what decision it</text>
<text x="101" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">supports.</text>
<path d="M600,266 V295" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="303" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="336" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">2. Identify stakeholders and authority</text>
<text x="101" y="371" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Name accountable owners, affected groups, specialists, and participation requirements.</text>
<path d="M600,396 V425" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="433" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="466" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">3. Define scope and comparator</text>
<text x="101" y="501" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Specify population, setting, intervention bundle, alternatives, outcomes, and exclusions.</text>
<path d="M600,526 V555" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="563" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="596" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">4. Complete and review the record</text>
<text x="101" y="631" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Document evidence, assumptions, unresolved questions, and required approvals.</text>
<path d="M600,656 V685" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="693" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="726" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">5. Authorize the next stage</text>
<text x="101" y="761" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Approve, revise, defer, or stop; archive the versioned record and review date.</text>
<text x="60" y="836" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#877567">Iterative decision support: return to earlier evidence or assessment when a review trigger requires it.</text>
</svg>