<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="941" viewBox="0 0 1200 941">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D5560"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#FBF8F3"/>
<rect x="0" y="0" width="1200" height="14" fill="#7A1730"/>
<text x="60" y="58" font-family="DejaVu Sans, Arial" font-size="32" font-weight="700" fill="#222A33">AIHE-Y: Data Quality and Fitness-for-Purpose Assessment</text>
<text x="60" y="90" font-family="DejaVu Sans, Arial" font-size="18" fill="#5A6470">Primary lifecycle stage: Assess readiness and data. Primary book chapter: 2.</text>
<rect x="110" y="160" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="208" r="28" fill="#7A1730"/>
<text x="158" y="217" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
<text x="205" y="197" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Specify readiness requirements</text>
<text x="205" y="232" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Define the institutional, data, infrastructure, and governance conditions</text>
<text x="205" y="254" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">relevant to Data Quality and Fitness-for-Purpose Assessment.</text>
<line x1="600.0" y1="273" x2="600.0" y2="295" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="303" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="351" r="28" fill="#7A1730"/>
<text x="158" y="360" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
<text x="205" y="340" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Collect documentary evidence</text>
<text x="205" y="375" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Inventory systems, data, interfaces, standards, roles, controls, and</text>
<text x="205" y="397" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">capability.</text>
<line x1="600.0" y1="416" x2="600.0" y2="438" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="446" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="494" r="28" fill="#7A1730"/>
<text x="158" y="503" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
<text x="205" y="483" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Assess fitness and critical gaps</text>
<text x="205" y="518" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Judge readiness using evidence, not aspiration, and identify non-compensatory</text>
<text x="205" y="540" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">deficiencies.</text>
<line x1="600.0" y1="559" x2="600.0" y2="581" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="589" rx="18" ry="18" width="980" height="104" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="637" r="28" fill="#7A1730"/>
<text x="158" y="646" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
<text x="205" y="626" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Assign remediation and owners</text>
<text x="205" y="661" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Define resources, actions, due dates, and evidence of completion.</text>
<line x1="600.0" y1="697" x2="600.0" y2="719" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="727" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="775" r="28" fill="#7A1730"/>
<text x="158" y="784" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">5</text>
<text x="205" y="764" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Authorize readiness status</text>
<text x="205" y="799" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Proceed, remediate, restrict scope, use silent validation, or select an</text>
<text x="205" y="821" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">alternative.</text>
<text x="1145" y="913" text-anchor="end" font-family="DejaVu Sans, Arial" font-size="14" fill="#7A828B">AI Healthcare Economics Digital Companion • Process-flow reference</text>
</svg>