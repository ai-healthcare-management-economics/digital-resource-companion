<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="878" viewBox="0 0 1200 878">
<rect width="1200" height="878" fill="#F5F0E7"/>
<rect width="1200" height="110" fill="#6B2230"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#877567"/></marker></defs>
<text x="60" y="43" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">AIHE-Y — Data Quality and Fitness-for-Purpose Assessment</text>
<rect x="75" y="148" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="181" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">1. Specify readiness requirements</text>
<text x="101" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Define the institutional, data, infrastructure, and governance conditions relevant to Data</text>
<text x="101" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Quality and Fitness-for-Purpose Assessment.</text>
<path d="M600,266 V295" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="303" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="336" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">2. Collect documentary evidence</text>
<text x="101" y="371" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Inventory systems, data, interfaces, standards, roles, controls, and capability.</text>
<path d="M600,396 V425" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="433" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="466" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">3. Assess fitness and critical gaps</text>
<text x="101" y="501" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Judge readiness using evidence, not aspiration, and identify non-compensatory deficiencies.</text>
<path d="M600,526 V555" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="563" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="596" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">4. Assign remediation and owners</text>
<text x="101" y="631" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Define resources, actions, due dates, and evidence of completion.</text>
<path d="M600,656 V685" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="693" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="726" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">5. Authorize readiness status</text>
<text x="101" y="761" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Proceed, remediate, restrict scope, use silent validation, or select an alternative.</text>
<text x="60" y="836" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#877567">Iterative decision support: return to earlier evidence or assessment when a review trigger requires it.</text>
</svg>