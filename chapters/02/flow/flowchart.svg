<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1058" viewBox="0 0 1200 1058">
<rect width="1200" height="1058" fill="#F5F0E7"/>
<rect width="1200" height="110" fill="#6B2230"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#877567"/></marker></defs>
<text x="60" y="43" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">Chapter 2: Institutional Readiness and Digital Foundations</text>
<rect x="75" y="148" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="181" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">1. Confirm strategic and service requirements</text>
<text x="101" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Link the proposed use to a documented priority and a realistic operating model.</text>
<path d="M600,241 V270" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="278" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="311" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">2. Inventory infrastructure and data assets</text>
<text x="101" y="346" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Document source systems, interfaces, identity, access, compute, storage, provenance, and</text>
<text x="101" y="371" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">support.</text>
<path d="M600,396 V425" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="433" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="466" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">3. Assess interoperability and data fitness</text>
<text x="101" y="501" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Evaluate syntactic, semantic, organizational, and temporal interoperability and use-case-</text>
<text x="101" y="526" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">specific data quality.</text>
<path d="M600,551 V580" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="588" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="621" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">4. Assess resilience, security, and technical debt</text>
<text x="101" y="656" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Review availability, logging, fallback, recovery, maintainability, and cumulative integration</text>
<text x="101" y="681" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">burden.</text>
<path d="M600,706 V735" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="743" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="776" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">5. Identify readiness gaps and owners</text>
<text x="101" y="811" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Classify critical deficiencies, assign remediation, resources, and completion evidence.</text>
<path d="M600,836 V865" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="873" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="906" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">6. Authorize readiness or restrict ambition</text>
<text x="101" y="941" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Proceed, remediate, use silent validation, limit scope, or select a non-AI alternative.</text>
<text x="60" y="1016" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#877567">Iterative decision support: return to earlier evidence or assessment when a review trigger requires it.</text>
</svg>