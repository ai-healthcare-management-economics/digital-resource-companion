<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1213" viewBox="0 0 1200 1213">
<rect width="1200" height="1213" fill="#F5F0E7"/>
<rect width="1200" height="110" fill="#6B2230"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#877567"/></marker></defs>
<text x="60" y="43" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">Chapter 11: Evidence, Validation, and Real-World Evaluation</text>
<rect x="75" y="148" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="181" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">1. Formulate the evidence question</text>
<text x="101" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Link intended use, comparator, population, outcome, decision consequence, and uncertainty.</text>
<path d="M600,241 V270" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="278" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="311" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">2. Map and appraise external evidence</text>
<text x="101" y="346" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Assess reporting quality, risk of bias, applicability, transportability, and evidence gaps.</text>
<path d="M600,371 V400" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="408" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="441" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">3. Plan local validation and silent-mode evaluation</text>
<text x="101" y="476" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Define cohort, data period, metrics, subgroups, workflow, human–AI interaction, and</text>
<text x="101" y="501" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">acceptance thresholds.</text>
<path d="M600,526 V555" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="563" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="596" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">4. Select a causal evaluation design</text>
<text x="101" y="631" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Use randomized, stepped-wedge, interrupted time series, difference-in-differences, target-</text>
<text x="101" y="656" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">trial, or other appropriate designs.</text>
<path d="M600,681 V710" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="718" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="751" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">5. Collect real-world clinical and implementation evidence</text>
<text x="101" y="786" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Measure use, fidelity, adaptations, context, outcomes, workload, equity, cost, and balancing</text>
<text x="101" y="811" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">effects.</text>
<path d="M600,836 V865" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="873" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="906" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">6. Synthesize quantitative and qualitative evidence</text>
<text x="101" y="941" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Integrate technical, clinical, economic, implementation, governance, and lived-experience</text>
<text x="101" y="966" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">findings.</text>
<path d="M600,991 V1020" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="1028" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="1061" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">7. Update the decision and evidence plan</text>
<text x="101" y="1096" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Scale, modify, continue, restrict, stop, or collect additional decision-critical evidence.</text>
<text x="60" y="1171" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#877567">Iterative decision support: return to earlier evidence or assessment when a review trigger requires it.</text>
</svg>