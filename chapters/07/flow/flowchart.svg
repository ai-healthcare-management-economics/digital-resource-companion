<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1238" viewBox="0 0 1200 1238">
<rect width="1200" height="1238" fill="#F5F0E7"/>
<rect width="1200" height="110" fill="#6B2230"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#877567"/></marker></defs>
<text x="60" y="43" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">Chapter 7: Economic Evaluation, Affordability, and Health Technology</text>
<text x="60" y="75" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">Assessment</text>
<rect x="75" y="148" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="181" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">1. Specify the economic and HTA decision</text>
<text x="101" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Define population, intervention, comparator, outcomes, perspective, horizon, and adoption</text>
<text x="101" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">authority.</text>
<path d="M600,266 V295" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="303" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="336" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">2. Select the evaluation form</text>
<text x="101" y="371" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Choose cost-consequence, cost-effectiveness, cost-utility, budget impact, distributional, or</text>
<text x="101" y="396" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">combined analysis.</text>
<path d="M600,421 V450" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="458" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="491" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">3. Estimate incremental costs and outcomes</text>
<text x="101" y="526" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Use the full pathway and document final, intermediate, workforce, quality, and equity</text>
<text x="101" y="551" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">effects.</text>
<path d="M600,576 V605" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="613" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="646" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">4. Assess affordability and reimbursement</text>
<text x="101" y="681" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Model annual cash flow, funding source, eligible volume, payment, coding, tariff, and denial</text>
<text x="101" y="706" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">implications.</text>
<path d="M600,731 V760" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="768" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="801" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">5. Characterize uncertainty and distribution</text>
<text x="101" y="836" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Use sensitivity, scenarios, subgroups, thresholds, and value-of-information logic.</text>
<path d="M600,861 V890" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="898" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="931" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">6. Integrate HTA, procurement, and local readiness</text>
<text x="101" y="966" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Distinguish regulatory authorization, assessment, reimbursement, procurement, and local</text>
<text x="101" y="991" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">adoption.</text>
<path d="M600,1016 V1045" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="1053" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="1086" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">7. Issue a conditional recommendation</text>
<text x="101" y="1121" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Adopt, pilot, restrict, defer, redesign, reject, or retire with explicit conditions.</text>
<text x="60" y="1196" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#877567">Iterative decision support: return to earlier evidence or assessment when a review trigger requires it.</text>
</svg>