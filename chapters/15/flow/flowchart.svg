<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1510" viewBox="0 0 1200 1510">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4D5560"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/></filter></defs>
<rect width="100%" height="100%" fill="#FBF8F3"/>
<rect x="0" y="0" width="1200" height="14" fill="#7A1730"/>
<text x="60" y="58" font-family="DejaVu Sans, Arial" font-size="32" font-weight="700" fill="#222A33">Chapter 15: Circularity-Adjusted Economic Evaluation and Sustainable Value</text>
<text x="60" y="90" font-family="DejaVu Sans, Arial" font-size="18" fill="#5A6470">Chapter-level decision process aligned to the fifteen-chapter reference edition.</text>
<rect x="110" y="160" rx="18" ry="18" width="980" height="136" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="208" r="28" fill="#7A1730"/>
<text x="158" y="217" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">1</text>
<text x="205" y="197" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Define the decision, functional unit, and</text>
<text x="205" y="225" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">system boundary</text>
<text x="205" y="260" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Specify the service output, population, quality level, volume, horizon,</text>
<text x="205" y="282" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">infrastructure, and lifecycle stages.</text>
<line x1="600.0" y1="300" x2="600.0" y2="322" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="330" rx="18" ry="18" width="980" height="136" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="378" r="28" fill="#7A1730"/>
<text x="158" y="387" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">2</text>
<text x="205" y="367" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Estimate conventional outcomes and lifecycle</text>
<text x="205" y="395" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">cost</text>
<text x="205" y="430" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Report health, service, workforce, quality, and economic effects before</text>
<text x="205" y="452" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">circular adjustments.</text>
<line x1="600.0" y1="470" x2="600.0" y2="492" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="500" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="548" r="28" fill="#7A1730"/>
<text x="158" y="557" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">3</text>
<text x="205" y="537" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Measure environmental and material flows</text>
<text x="205" y="572" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Quantify energy, water, carbon, virgin and recovered materials, waste, and</text>
<text x="205" y="594" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">critical dependencies per functional unit.</text>
<line x1="600.0" y1="613" x2="600.0" y2="635" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="643" rx="18" ry="18" width="980" height="136" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="691" r="28" fill="#7A1730"/>
<text x="158" y="700" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
<text x="205" y="680" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Estimate residual, recovered, and resilience</text>
<text x="205" y="708" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">value</text>
<text x="205" y="743" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Include remaining useful life, redeployment, take-back, recovery costs,</text>
<text x="205" y="765" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">continuity, and supply-chain effects.</text>
<line x1="600.0" y1="783" x2="600.0" y2="805" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="813" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="861" r="28" fill="#7A1730"/>
<text x="158" y="870" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">5</text>
<text x="205" y="850" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Assess equity and burden distribution</text>
<text x="205" y="885" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Identify who benefits and who bears environmental, labor, access, and regional</text>
<text x="205" y="907" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">burdens.</text>
<line x1="600.0" y1="926" x2="600.0" y2="948" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="956" rx="18" ry="18" width="980" height="136" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="1004" r="28" fill="#7A1730"/>
<text x="158" y="1013" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">6</text>
<text x="205" y="993" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Monetize cautiously or preserve disaggregated</text>
<text x="205" y="1021" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">evidence</text>
<text x="205" y="1056" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Document valuation sources, uncertainty, non-monetized effects, and</text>
<text x="205" y="1078" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">double-counting checks.</text>
<line x1="600.0" y1="1096" x2="600.0" y2="1118" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="1126" rx="18" ry="18" width="980" height="136" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="1174" r="28" fill="#7A1730"/>
<text x="158" y="1183" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">7</text>
<text x="205" y="1163" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Test uncertainty, rebound, and robust</text>
<text x="205" y="1191" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">decisions</text>
<text x="205" y="1226" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Compare options under plausible use, life, price, environmental, recovery, and</text>
<text x="205" y="1248" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">induced-demand scenarios.</text>
<line x1="600.0" y1="1266" x2="600.0" y2="1288" stroke="#4D5560" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="110" y="1296" rx="18" ry="18" width="980" height="109" fill="#FFFFFF" stroke="#C7CDD4" stroke-width="2" filter="url(#shadow)"/>
<circle cx="158" cy="1344" r="28" fill="#7A1730"/>
<text x="158" y="1353" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#FFFFFF">8</text>
<text x="205" y="1333" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#252C35">Issue a transparent decision with safeguards</text>
<text x="205" y="1368" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">Present conventional and circularity-adjusted results, mandatory constraints,</text>
<text x="205" y="1390" font-family="DejaVu Sans, Arial" font-size="18" fill="#4D5864">conditions, and review triggers.</text>
<text x="1145" y="1482" text-anchor="end" font-family="DejaVu Sans, Arial" font-size="14" fill="#7A828B">AI Healthcare Economics Digital Companion • Process-flow reference</text>
</svg>