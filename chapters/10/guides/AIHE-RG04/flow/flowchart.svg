<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="853" viewBox="0 0 1200 853">
<rect width="1200" height="853" fill="#F5F0E7"/>
<rect width="1200" height="110" fill="#6B2230"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#877567"/></marker></defs>
<text x="60" y="43" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">AIHE-RG04 — Regulatory, Standards, and Policy Update Register</text>
<rect x="75" y="148" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="181" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">1. Define the question</text>
<text x="101" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">State the selection, verification, comparison, or update decision.</text>
<path d="M600,241 V270" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="278" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="311" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">2. Identify applicable options</text>
<text x="101" y="346" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">List relevant instruments, scenarios, evidence domains, or failure patterns.</text>
<path d="M600,371 V400" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="408" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="441" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">3. Verify status and scope</text>
<text x="101" y="476" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Record authority, edition, jurisdiction, purpose, and limits.</text>
<path d="M600,501 V530" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="538" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="571" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">4. Complete the local record</text>
<text x="101" y="606" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Document evidence, judgement, ownership, gaps, and action.</text>
<path d="M600,631 V660" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="668" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="701" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">5. Review and update</text>
<text x="101" y="736" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Approve, archive, and set the next review or trigger.</text>
<text x="60" y="811" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#877567">Iterative decision support: return to earlier evidence or assessment when a review trigger requires it.</text>
</svg>