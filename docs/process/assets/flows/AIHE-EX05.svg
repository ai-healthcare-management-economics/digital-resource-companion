<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1288" viewBox="0 0 1200 1288">
<rect width="1200" height="1288" fill="#F5F0E7"/>
<rect width="1200" height="110" fill="#6B2230"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#877567"/></marker></defs>
<text x="60" y="43" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">AIHE-EX05 — Local Validation Report Template</text>
<rect x="75" y="148" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="181" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">1. Define the local decision and intended use</text>
<text x="101" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Specify the population, setting, user, decision window, comparator, expected action,</text>
<text x="101" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">consequence of error, accountable owner, and exact system version.</text>
<path d="M600,266 V295" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="303" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="336" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">2. Define the validation cohort and evidence period</text>
<text x="101" y="371" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Record inclusion and exclusion criteria, data provenance, reference standard, missingness,</text>
<text x="101" y="396" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">representation, timing, and transformations or mappings.</text>
<path d="M600,421 V450" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="458" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="491" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">3. Evaluate predictive or diagnostic performance</text>
<text x="101" y="526" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Assess discrimination, calibration, sensitivity, specificity, predictive values, error</text>
<text x="101" y="551" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">burden, threshold-specific performance, and uncertainty as appropriate.</text>
<path d="M600,576 V605" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="613" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="646" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">4. Examine subgroup and workflow performance</text>
<text x="101" y="681" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Assess relevant subgroups, human–AI interaction, response capacity, overrides, action</text>
<text x="101" y="706" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">latency, workarounds, and balancing measures.</text>
<path d="M600,731 V760" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="768" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="801" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">5. Assess clinical utility and decision consequences</text>
<text x="101" y="836" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Determine whether the output improves a defined decision or pathway relative to the</text>
<text x="101" y="861" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">comparator; keep validation separate from causal claims about downstream outcomes.</text>
<path d="M600,886 V915" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="923" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="956" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">6. Record limitations and decision conditions</text>
<text x="101" y="991" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">State evidence gaps, mitigation, monitoring, restrictions, additional evidence, and</text>
<text x="101" y="1016" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">conditions for proceeding, piloting, recalibrating, deferring, or stopping.</text>
<path d="M600,1041 V1070" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="1078" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="1111" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">7. Approve and preserve the versioned record</text>
<text x="101" y="1146" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Record accountable authority, evidence cut-off, decision date, dissent, next review date, and</text>
<text x="101" y="1171" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">triggers for revalidation after material change.</text>
<text x="60" y="1246" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#877567">Iterative decision support: return to earlier evidence or assessment when a review trigger requires it.</text>
</svg>