<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1288" viewBox="0 0 1200 1288">
<rect width="1200" height="1288" fill="#F5F0E7"/>
<rect width="1200" height="110" fill="#6B2230"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#877567"/></marker></defs>
<text x="60" y="43" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">Chapter 12: Decision Architecture and Lifecycle Governance</text>
<rect x="75" y="148" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="181" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">1. Establish the decision identity</text>
<text x="101" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Specify the complete intervention, version, intended use, population, setting, comparator,</text>
<text x="101" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">and accountable authority.</text>
<path d="M600,266 V295" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="303" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="336" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">2. Integrate evidence without aggregation</text>
<text x="101" y="371" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Use the AI-HEVG domains to preserve distinct specialist judgements, mandatory safeguards,</text>
<text x="101" y="396" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">uncertainties, and dissent.</text>
<path d="M600,421 V450" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="458" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="491" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">3. Record current institutional permission</text>
<text x="101" y="526" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Maintain the AI-HED evidence links, current state, scope, effective date, conditions,</text>
<text x="101" y="551" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">triggers, and decision history. Implementation activity is recorded separately.</text>
<path d="M600,576 V605" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="613" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="646" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">4. Monitor decision-relevant triggers</text>
<text x="101" y="681" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Assign owners, thresholds, cadence, and default responses for technical, clinical, workflow,</text>
<text x="101" y="706" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">equity, economic, contractual, and support changes.</text>
<path d="M600,731 V760" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="768" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="801" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">5. Assess incidents and material change</text>
<text x="101" y="836" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Reconstruct versions, data, outputs, human action, context, causes, and corrective action;</text>
<text x="101" y="861" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">determine which evidence and permissions require reconsideration.</text>
<path d="M600,886 V915" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="923" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="956" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">6. Reassess renewal and alternatives</text>
<text x="101" y="991" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Treat renewal as a new decision. Compare continuation, renegotiation, restriction,</text>
<text x="101" y="1016" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">replacement, and de-adoption using current evidence and safeguards.</text>
<path d="M600,1041 V1070" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="1078" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="1111" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">7. Close authorization and preserve learning</text>
<text x="101" y="1146" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Protect continuity, manage records and contracts, document retirement or supersession, and</text>
<text x="101" y="1171" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">carry verified lessons into institutional governance.</text>
<text x="60" y="1246" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#877567">Iterative decision support: return to earlier evidence or assessment when a review trigger requires it.</text>
</svg>