<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1238" viewBox="0 0 1200 1238">
<rect width="1200" height="1238" fill="#F5F0E7"/>
<rect width="1200" height="110" fill="#6B2230"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#877567"/></marker></defs>
<text x="60" y="43" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">Chapter 6: Lifecycle Cost, Pricing, and Benefit Realization</text>
<rect x="75" y="148" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="181" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">1. Define the cost boundary and perspective</text>
<text x="101" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Identify decision-maker, time horizon, budget holder, functional unit, and relevant lifecycle</text>
<text x="101" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">phases.</text>
<path d="M600,266 V295" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="303" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="336" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">2. Build the lifecycle cost inventory</text>
<text x="101" y="371" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Measure acquisition, data, integration, infrastructure, validation, training, review,</text>
<text x="101" y="396" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">governance, monitoring, incidents, updates, and exit.</text>
<path d="M600,421 V450" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="458" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="491" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">3. Specify the pricing architecture</text>
<text x="101" y="526" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Separate base, variable, volume, support, integration, escalation, and residual-value terms.</text>
<path d="M600,551 V580" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="588" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="621" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">4. Model volume and downside scenarios</text>
<text x="101" y="656" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Test uptake, use intensity, implementation delay, review burden, price escalation, and</text>
<text x="101" y="681" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">uncertainty.</text>
<path d="M600,706 V735" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="743" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="776" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">5. Map benefit mechanisms</text>
<text x="101" y="811" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Link claimed savings or outcomes to measurable changes, owners, timing, and conversion</text>
<text x="101" y="836" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">conditions.</text>
<path d="M600,861 V890" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="898" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="931" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">6. Calculate ROI and net value cautiously</text>
<text x="101" y="966" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Distinguish gross benefit, net benefit, cashable savings, released capacity, and non-</text>
<text x="101" y="991" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">monetized value.</text>
<path d="M600,1016 V1045" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="1053" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="1086" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">7. Set benefit-realization and renewal conditions</text>
<text x="101" y="1121" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Assign owners, thresholds, review dates, remedies, and continuation criteria.</text>
<text x="60" y="1196" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#877567">Iterative decision support: return to earlier evidence or assessment when a review trigger requires it.</text>
</svg>