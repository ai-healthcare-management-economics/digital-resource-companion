<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1188" viewBox="0 0 1200 1188">
<rect width="1200" height="1188" fill="#F5F0E7"/>
<rect width="1200" height="110" fill="#6B2230"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#877567"/></marker></defs>
<text x="60" y="43" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">Chapter 4: Productivity, Work Redesign, and Implementation</text>
<rect x="75" y="148" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="181" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">1. Decompose tasks and establish the baseline</text>
<text x="101" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Measure current work, handoffs, delay, rework, quality, burden, and role boundaries.</text>
<path d="M600,241 V270" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="278" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="311" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">2. Identify AI–human allocation options</text>
<text x="101" y="346" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Separate tasks suitable for automation, augmentation, review, escalation, and human-only</text>
<text x="101" y="371" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">performance.</text>
<path d="M600,396 V425" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="433" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="466" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">3. Redesign workflow and roles</text>
<text x="101" y="501" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Define new responsibilities, supervision, competencies, fallback, and downstream capacity.</text>
<path d="M600,526 V555" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="563" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="596" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">4. Implement a controlled pilot</text>
<text x="101" y="631" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Train users, monitor adoption, collect workflow evidence, and preserve reversibility.</text>
<path d="M600,656 V685" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="693" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="726" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">5. Measure gross and net productivity</text>
<text x="101" y="761" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Subtract review, correction, coordination, downtime, and displaced work from gross time</text>
<text x="101" y="786" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">saved.</text>
<path d="M600,811 V840" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="848" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="881" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">6. Convert released capacity into realized value</text>
<text x="101" y="916" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Document redeployment, improved quality, reduced delay, avoided harm, or other verified</text>
<text x="101" y="941" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">outcomes.</text>
<path d="M600,966 V995" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="1003" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="1036" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">7. Adapt and sustain</text>
<text x="101" y="1071" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Address implementation determinants, professional effects, maintenance, and scale conditions.</text>
<text x="60" y="1146" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#877567">Iterative decision support: return to earlier evidence or assessment when a review trigger requires it.</text>
</svg>