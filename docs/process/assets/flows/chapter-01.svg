<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1108" viewBox="0 0 1200 1108">
<rect width="1200" height="1108" fill="#F5F0E7"/>
<rect width="1200" height="110" fill="#6B2230"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#877567"/></marker></defs>
<text x="60" y="43" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">Chapter 1: AI as a Health System Intervention</text>
<rect x="75" y="148" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="181" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">1. Define the institutional problem</text>
<text x="101" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">State the baseline burden, affected population, decision-maker, and decision window.</text>
<path d="M600,241 V270" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="278" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="311" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">2. Map the complete intervention bundle</text>
<text x="101" y="346" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Include data, model, interfaces, users, review, workflow, downstream action, monitoring,</text>
<text x="101" y="371" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">support, and exit.</text>
<path d="M600,396 V425" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="433" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="466" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">3. Identify realistic comparators</text>
<text x="101" y="501" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Compare AI with current practice, process redesign, staffing, conventional digital tools,</text>
<text x="101" y="526" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">other AI, and no-change options.</text>
<path d="M600,551 V580" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="588" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="621" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">4. Formulate the causal value hypothesis</text>
<text x="101" y="656" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Explain how the intervention changes decisions, actions, outcomes, resources, equity, and</text>
<text x="101" y="681" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">public value.</text>
<path d="M600,706 V735" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="743" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="776" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">5. Specify evidence and safeguards</text>
<text x="101" y="811" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Define the evidence required, mandatory safeguards, uncertainty, and conditions for</text>
<text x="101" y="836" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">responsible use.</text>
<path d="M600,861 V890" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="898" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="931" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">6. Set a reversible decision rule</text>
<text x="101" y="966" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Define proceed, redesign, validate silently, pilot, scale, restrict, pause, replace, or</text>
<text x="101" y="991" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">retire criteria.</text>
<text x="60" y="1066" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#877567">Iterative decision support: return to earlier evidence or assessment when a review trigger requires it.</text>
</svg>