<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1238" viewBox="0 0 1200 1238">
<rect width="1200" height="1238" fill="#F5F0E7"/>
<rect width="1200" height="110" fill="#6B2230"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#877567"/></marker></defs>
<text x="60" y="43" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">Chapter 9: Problem-First Procurement and Vendor Governance</text>
<rect x="75" y="148" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="181" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">1. Define the service problem and procurement specification</text>
<text x="101" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Start from the desired outcome, workflow, comparator, evidence, and safeguards rather than a</text>
<text x="101" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">vendor product.</text>
<path d="M600,266 V295" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="303" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="336" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">2. Scan the market and challenge claims</text>
<text x="101" y="371" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Decompose clinical, operational, economic, interoperability, fairness, and productivity</text>
<text x="101" y="396" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">claims.</text>
<path d="M600,421 V450" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="458" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="491" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">3. Run a workflow-based demonstration</text>
<text x="101" y="526" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Test representative cases, limitations, exceptions, usability, integration, and monitoring</text>
<text x="101" y="551" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">capability.</text>
<path d="M600,576 V605" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="613" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="646" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">4. Conduct multidisciplinary due diligence</text>
<text x="101" y="681" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Review evidence, data, cybersecurity, privacy, quality, clinical safety, economics, vendor</text>
<text x="101" y="706" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">viability, and support.</text>
<path d="M600,731 V760" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="768" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="801" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">5. Evaluate pricing, risk sharing, and total cost</text>
<text x="101" y="836" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Model volume, integration, support, updates, monitoring, remedies, and exit exposure.</text>
<path d="M600,861 V890" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="898" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="931" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">6. Negotiate enforceable lifecycle terms</text>
<text x="101" y="966" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Specify intended use, audit, updates, data rights, service levels, continuity, portability,</text>
<text x="101" y="991" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">take-back, and termination.</text>
<path d="M600,1016 V1045" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="1053" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="1086" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">7. Approve conditionally and monitor</text>
<text x="101" y="1121" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Use gates, local validation, pilot conditions, renewal criteria, and exit readiness.</text>
<text x="60" y="1196" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#877567">Iterative decision support: return to earlier evidence or assessment when a review trigger requires it.</text>
</svg>