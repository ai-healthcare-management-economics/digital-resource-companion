<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="903" viewBox="0 0 1200 903">
<rect width="1200" height="903" fill="#F5F0E7"/>
<rect width="1200" height="110" fill="#6B2230"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#877567"/></marker></defs>
<text x="60" y="43" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">AIHE-D04 — Incident Classification and Reconstruction</text>
<rect x="75" y="148" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="181" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">1. Prepare implementation and control conditions</text>
<text x="101" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Define readiness, training, workflow, fallback, evidence, and governance requirements for</text>
<text x="101" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Incident Classification and Reconstruction.</text>
<path d="M600,266 V295" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="303" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="336" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">2. Implement in stages</text>
<text x="101" y="371" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Use silent mode, controlled pilot, acceptance criteria, and accountable decision gates.</text>
<path d="M600,396 V425" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="433" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="466" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">3. Monitor technical and service performance</text>
<text x="101" y="501" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Review outcomes, workload, subgroups, incidents, costs, adoption, and contract performance.</text>
<path d="M600,526 V555" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="563" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="596" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">4. Investigate incidents and material changes</text>
<text x="101" y="631" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Reconstruct data, versions, outputs, human actions, causes, corrective action, and</text>
<text x="101" y="656" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">revalidation.</text>
<path d="M600,681 V710" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="718" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="751" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">5. Renew, restrict, replace, or retire</text>
<text x="101" y="786" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Compare current value and risk with alternatives, continuity, and exit readiness.</text>
<text x="60" y="861" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#877567">Iterative decision support: return to earlier evidence or assessment when a review trigger requires it.</text>
</svg>