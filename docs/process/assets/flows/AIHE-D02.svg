<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1003" viewBox="0 0 1200 1003">
<rect width="1200" height="1003" fill="#F5F0E7"/>
<rect width="1200" height="110" fill="#6B2230"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#877567"/></marker></defs>
<text x="60" y="43" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">AIHE-D02 — Lifecycle Decision State, Staged Evidence, and AI-HED Status</text>
<rect x="75" y="148" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="181" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">1. Define and preserve the decision identity</text>
<text x="101" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Record intervention, supplier, model, configuration, data, workflow, population, setting,</text>
<text x="101" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">comparator, and version.</text>
<path d="M600,266 V295" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="303" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="336" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">2. Link authoritative evidence and safeguards</text>
<text x="101" y="371" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Link specialist evidence, its cut-off and limitations; preserve non-compensatory safeguards,</text>
<text x="101" y="396" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">uncertainty, dissent, and accountable review.</text>
<path d="M600,421 V450" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="458" width="1050" height="140" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="491" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">3. Record the current decision state</text>
<text x="101" y="526" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Use one of the seven institutional states: Under consideration; Evaluation authorized;</text>
<text x="101" y="551" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Conditional use; Authorized use; Restricted use; Paused or suspended; Retired or superseded.</text>
<text x="101" y="576" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Do not substitute an implementation activity for permission.</text>
<path d="M600,601 V630" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="638" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="671" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">4. Specify scope, conditions, and transition triggers</text>
<text x="101" y="706" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Record permitted users and functions, exclusions, effective date, expiry or review,</text>
<text x="101" y="731" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">conditions, thresholds, and responsible owners.</text>
<path d="M600,756 V785" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="793" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="826" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">5. Maintain decision history and continuing review</text>
<text x="101" y="861" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Document reasons, authority, dates, and changes. Reconsider permission after relevant</text>
<text x="101" y="886" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">triggers, material change, renewal, replacement, or retirement.</text>
<text x="60" y="961" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#877567">Iterative decision support: return to earlier evidence or assessment when a review trigger requires it.</text>
</svg>