<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="878" viewBox="0 0 1200 878">
<rect width="1200" height="878" fill="#F5F0E7"/>
<rect width="1200" height="110" fill="#6B2230"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#877567"/></marker></defs>
<text x="60" y="43" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">AIHE-EX07 — Benefit Realization and Capacity Conversion Log</text>
<rect x="75" y="148" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="181" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">1. Specify the economic decision</text>
<text x="101" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Define perspective, comparator, population, horizon, and decision rule for Benefit</text>
<text x="101" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Realization and Capacity Conversion Log.</text>
<path d="M600,266 V295" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="303" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="336" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">2. Collect cost, outcome, and pricing evidence</text>
<text x="101" y="371" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Document lifecycle resources, benefit mechanisms, uptake, reimbursement, and uncertainty.</text>
<path d="M600,396 V425" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="433" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="466" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">3. Construct base and alternative scenarios</text>
<text x="101" y="501" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Model volume, implementation, prices, outcomes, distribution, and affordability.</text>
<path d="M600,526 V555" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="563" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="596" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">4. Review validity and uncertainty</text>
<text x="101" y="631" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Test assumptions, thresholds, sensitivity, and decision-critical evidence gaps.</text>
<path d="M600,656 V685" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="693" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="726" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">5. Issue a conditional economic recommendation</text>
<text x="101" y="761" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">State value, affordability, funding, conditions, evidence needs, and review triggers.</text>
<text x="60" y="836" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#877567">Iterative decision support: return to earlier evidence or assessment when a review trigger requires it.</text>
</svg>