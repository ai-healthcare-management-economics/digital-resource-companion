<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="928" viewBox="0 0 1200 928">
<rect width="1200" height="928" fill="#F5F0E7"/>
<rect width="1200" height="110" fill="#6B2230"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#877567"/></marker></defs>
<text x="60" y="43" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">AIHE-EX16 — Reproducible Analysis, Model Risk, and Code Quality</text>
<text x="60" y="75" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">Checklist</text>
<rect x="75" y="148" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="181" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">1. Formulate the decision structure</text>
<text x="101" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Define the states, events, queues, actors, feedback, outputs, and decision rule relevant to</text>
<text x="101" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Reproducible Analysis, Model Risk, and Code Quality Checklist.</text>
<path d="M600,266 V295" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="303" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="336" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">2. Select and parameterize the model</text>
<text x="101" y="371" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Choose an analytic or simulation method and document data, parameters, distributions, and</text>
<text x="101" y="396" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">versions.</text>
<path d="M600,421 V450" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="458" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="491" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">3. Verify implementation</text>
<text x="101" y="526" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Test logic, calculations, code, traces, convergence, and extreme values.</text>
<path d="M600,551 V580" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="588" width="1050" height="90" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="621" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">4. Validate and characterize uncertainty</text>
<text x="101" y="656" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Assess intended-use validity, sensitivity, structural alternatives, and value of information.</text>
<path d="M600,681 V710" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="718" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="751" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">5. Communicate and archive</text>
<text x="101" y="786" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Present results, limitations, reproducibility, decision implications, and update</text>
<text x="101" y="811" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">requirements.</text>
<text x="60" y="886" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#877567">Iterative decision support: return to earlier evidence or assessment when a review trigger requires it.</text>
</svg>