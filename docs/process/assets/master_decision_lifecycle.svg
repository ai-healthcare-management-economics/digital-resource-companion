<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1878" viewBox="0 0 1200 1878">
<rect width="1200" height="1878" fill="#F5F0E7"/>
<rect width="1200" height="110" fill="#6B2230"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#877567"/></marker></defs>
<text x="60" y="43" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">Master Institutional Decision Lifecycle</text>
<rect x="75" y="148" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="181" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">1. Define the decision</text>
<text x="101" y="216" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Specify the service problem, population, complete intervention, realistic comparators,</text>
<text x="101" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">outcomes, value mechanism, stakeholders, and accountable authority.</text>
<path d="M600,266 V295" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="303" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="336" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">2. Assess readiness and data</text>
<text x="101" y="371" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Evaluate institutional capability, data fitness, provenance, interoperability, lawful access,</text>
<text x="101" y="396" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">resilience, technical debt, workflow capacity, and prerequisite investment.</text>
<path d="M600,421 V450" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="458" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="491" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">3. Establish evidence and quality requirements</text>
<text x="101" y="526" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Define validation, reporting, appraisal, quality-control, accreditation, patient-safety, and</text>
<text x="101" y="551" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">independent-assurance requirements before consequential use.</text>
<path d="M600,576 V605" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="613" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="646" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">4. Model cost, value, affordability, and HTA</text>
<text x="101" y="681" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Estimate lifecycle cost, pricing exposure, benefit realization, cost-effectiveness, budget</text>
<text x="101" y="706" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">impact, affordability, distribution, reimbursement, and HTA implications.</text>
<path d="M600,731 V760" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="768" width="1050" height="140" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="801" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">5. Select the decision model and characterize uncertainty</text>
<text x="101" y="836" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Choose a decision or simulation structure that matches the causal and operational problem;</text>
<text x="101" y="861" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">document assumptions, verification, sensitivity, scenarios, thresholds, and value of</text>
<text x="101" y="886" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">information.</text>
<path d="M600,911 V940" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="948" width="1050" height="115" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="981" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">6. Assess governance and institutional risk</text>
<text x="101" y="1016" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Evaluate accountability, human oversight, ethics, equity, privacy, cybersecurity, resilience,</text>
<text x="101" y="1041" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">trust, contestability, communication, and institutional risk as connected requirements.</text>
<path d="M600,1066 V1095" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="1103" width="1050" height="140" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="1136" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">7. Procure and contract</text>
<text x="101" y="1171" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Translate the defined service need into vendor evidence requirements, due diligence,</text>
<text x="101" y="1196" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">acceptance testing, pricing, audit rights, update control, continuity, portability, remedies,</text>
<text x="101" y="1221" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">and exit.</text>
<path d="M600,1246 V1275" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="1283" width="1050" height="140" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="1316" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">8. Implement, monitor, and control change</text>
<text x="101" y="1351" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Use staged implementation, role and competency design, post-deployment monitoring,</text>
<text x="101" y="1376" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">algorithmovigilance, incident reconstruction, corrective action, material-change review, and</text>
<text x="101" y="1401" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">renewal controls.</text>
<path d="M600,1426 V1455" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="1463" width="1050" height="140" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="1496" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">9. Reassess continuing value, affordability, and support</text>
<text x="101" y="1531" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Reassess the current comparator, realized benefits, lifecycle costs, budget exposure,</text>
<text x="101" y="1556" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">supplier support, infrastructure dependencies, continuity, residual value, and credible</text>
<text x="101" y="1581" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">replacement or exit options.</text>
<path d="M600,1606 V1635" stroke="#877567" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="75" y="1643" width="1050" height="140" rx="12" fill="#FFFFFF" stroke="#BDA477" stroke-width="2"/>
<text x="101" y="1676" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#6B2230">10. Assemble the decision record and renew or retire</text>
<text x="101" y="1711" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">Integrate evidence, economics, governance, implementation, monitoring, conditions, dissent,</text>
<text x="101" y="1736" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">and accountability into a versioned decision record and make an explicit continue, redesign,</text>
<text x="101" y="1761" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#303236">restrict, replace, or retire decision.</text>
<text x="60" y="1836" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#877567">Iterative decision support: return to earlier evidence or assessment when a review trigger requires it.</text>
</svg>